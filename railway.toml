[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "sh -c 'node ../scripts/migrate.js && node src/server.js'"
# Hiberna o serviço após ~10 min sem tráfego (Serverless / App Sleeping).
sleepApplication = true
