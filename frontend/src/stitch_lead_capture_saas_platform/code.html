<style>
        .login-shadow {
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
        }
        .data-lines-bg {
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.15) 0%, transparent 50%);
        }
        .abstract-network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            pointer-events: none;
            background: 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 40px 40px,
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 40px 40px;
        }
        .abstract-network::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 10%;
            width: 80%;
            height: 60%;
            background: 
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10,50 L40,20 L70,60 L90,30" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/><circle cx="10" cy="50" r="3" fill="rgba(255,255,255,0.2)"/><circle cx="40" cy="20" r="3" fill="rgba(255,255,255,0.2)"/><circle cx="70" cy="60" r="3" fill="rgba(255,255,255,0.2)"/><circle cx="90" cy="30" r="3" fill="rgba(255,255,255,0.2)"/></svg>') no-repeat center center;

<body class="bg-brand-gray text-on-background min-h-screen flex font-body-default text-body-default antialiased selection:bg-primary-container selection:text-white">
<!-- Split Screen Container -->
<div class="flex w-full min-h-screen">
<!-- Left Side: Branding Area (Desktop Only) -->
<div class="hidden lg:flex flex-col justify-between w-1/2 bg-brand-navy p-xxxl relative overflow-hidden data-lines-bg">
<div class="abstract-network"></div>
<!-- Logo -->
<div class="z-10">
<img alt="Lead Capture Logo" class="w-12 h-12 rounded-sm object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzGP-my6yYJK61wGppd3kvhlwPlKLeIV3FUBzW4sSv_t-NSTrUGu-n6QdJhfqfs0LIsoD4puL4RXIRTNgiyvqlcQIyvMeb__XTGmveHGkXlSFcw0t6s-tMVlzWc35ZlZVIsgqsQBKuwctjgD7faR0feF1vPIZM1wNLCFjDuQ0ITaXv2OfFfa-4L7RcbtNhMZ3kzy8qeWAelDD1R0YJG5ZWqDYjkko6FVIQMHCZwxOE0wT7WBDUsd8"/>
</div>
<!-- Value Proposition -->
<div class="z-10 max-w-lg mb-xxxl">
<h1 class="font-h1-display text-h1-display text-white mb-lg">
                    Transforme seus anúncios em oportunidades reais.
                </h1>
<p class="font-subtitle text-subtitle text-white/70">
                    Conecte suas campanhas, capture leads e acompanhe seus clientes em um único lugar.
                </p>
</div>
<div class="z-10">
<!-- Empty div for flex alignment -->
</div>
</div>
<!-- Right Side: Login Area -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-xl relative bg-brand-gray">
<!-- Mobile Logo (Visible only on small screens) -->
<div class="absolute top-xl left-xl lg:hidden">
<img alt="Lead Capture Logo" class="w-10 h-10 rounded-sm object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzGP-my6yYJK61wGppd3kvhlwPlKLeIV3FUBzW4sSv_t-NSTrUGu-n6QdJhfqfs0LIsoD4puL4RXIRTNgiyvqlcQIyvMeb__XTGmveHGkXlSFcw0t6s-tMVlzWc35ZlZVIsgqsQBKuwctjgD7faR0feF1vPIZM1wNLCFjDuQ0ITaXv2OfFfa-4L7RcbtNhMZ3kzy8qeWAelDD1R0YJG5ZWqDYjkko6FVIQMHCZwxOE0wT7WBDUsd8"/>
</div>
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-white rounded-lg login-shadow border border-brand-border p-xxxl">
<!-- Header -->
<div class="mb-xxl">
<h2 class="font-h1-display text-[32px] font-bold text-brand-navy mb-sm leading-tight tracking-tight">
                        Bem-vindo novamente
                    </h2>
<p class="font-subtitle text-[16px] text-brand-slate">
                        Entre na sua conta para continuar
                    </p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block font-label-medium text-[14px] font-medium text-on-surface" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="block w-full pl-[40px] pr-md py-sm h-[40px] rounded-md border-outline-variant bg-white text-input-text text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="email" name="email" placeholder="Digite seu email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="block font-label-medium text-[14px] font-medium text-on-surface" for="password">Senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="block w-full pl-[40px] pr-[40px] py-sm h-[40px] rounded-md border-outline-variant bg-white text-input-text text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="password" name="password" placeholder="Digite sua senha" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full h-[48px] bg-brand-blue hover:bg-primary-container text-white rounded-[8px] font-button-text text-[15px] font-semibold flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                            Entrar
                        </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-xl text-center">
<a class="font-label-medium text-[14px] font-medium text-brand-blue hover:text-on-primary-fixed-variant transition-colors" href="#">
                        Esqueceu sua senha?
                    </a>
</div>
</div>
</div>
</div>
